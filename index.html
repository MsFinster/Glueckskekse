<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍪 Glückskeks</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff3d6, #ffe0a3);
    }

    .box {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: #fffaf0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      color: #c07a2c;
    }

    #spruch {
      font-size: 1.1rem;
      color: #5a3d20;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #f7c873;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd98a;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🍪 Glückskeks</h1>
    <div id="spruch">Klicke auf den Button!</div>
    <button onclick="neuerSpruch()">Neuer Spruch</button>
  </div>

  <script>
    const sprueche = [
      "Manchmal ist der Umweg der beste Weg.",
      "Deine Neugier bringt dich weiter als jeder Plan.",
      "Heute ist ein guter Tag für etwas Neues.",
      "Vertraue dem Prozess.",
      "Du bist stärker als du denkst.",
      "Ein kleiner Schritt verändert alles.",
      "Du bist näher dran als du glaubst.",
      "Das, was dich begeistert, ist kein Zufall.",
      "Geduld ist auch eine Stärke.",
      "Du darfst deinen eigenen Weg gehen.",
      "Lebe deine Träume.",
      "Mach dein Ding.",
      "Alles kommt zur richtigen Zeit.",
      "Bleib wie du bist.",
      "Du bist wichtig.",
      "Viel Glück.",
      "Du findest immer einen Weg.",
      "Heute kann dein Tag sein."
    ];

    function neuerSpruch() {
      const zufall = Math.floor(Math.random() * sprueche.length);
      document.getElementById("spruch").textContent = sprueche[zufall];
    }

    // direkt beim Laden ersten Spruch zeigen
    neuerSpruch();
  </script>

</body>
</html>
